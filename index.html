<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR TOUR 'KNOCK ON' Vol.2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #EBF5FF; /* 調整為更明顯的清爽淺藍色 */
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-blur { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .checkmark-done { text-decoration: line-through; opacity: 0.3; }
        .region-content { padding-top: 1.25rem !important; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.08), 0 8px 10px -6px rgba(59, 130, 246, 0.08); }
    </style>
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const RATES = {
            "KRW": 0.024, "JPY": 0.21, "USD": 32.5, "IDR": 0.002, "MYR": 6.8,
            "HKD": 4.15, "SGD": 24.0, "THB": 0.88, "MXN": 1.9, "CAD": 23.5, "TWD": 1
        };

        const PRESET_TODOS = ["護照", "手機", "錢包", "鑰匙", "手燈", "電池", "門票", "望遠鏡"];

        const tourData = [
            { id: 1, region: "韓國", city: "首爾", venue: "KSPO Dome", date: "2026-07-17", dateRange: "07/17–07/19", currency: "KRW" },
            { id: 2, region: "韓國", city: "釜山", venue: "Busan Sajik Gymnasium", date: "2026-08-01", dateRange: "08/01–08/02", currency: "KRW" },
            { id: 3, region: "日本", city: "神奈川", venue: "K-Arena Yokohama", date: "2026-08-21", dateRange: "08/21–08/23", currency: "JPY" },
            { id: 4, region: "日本", city: "佐賀", venue: "Saga Arena", date: "2026-08-29", dateRange: "08/29–08/30", currency: "JPY" },
            { id: 5, region: "日本", city: "大阪", venue: "Osaka-jō Hall", date: "2026-09-09", dateRange: "09/09–09/10", currency: "JPY" },
            { id: 6, region: "日本", city: "宮城", venue: "Sekisui Heim Super Arena", date: "2026-09-19", dateRange: "09/19–09/20", currency: "JPY" },
            { id: 7, region: "日本", city: "長野", venue: "Big Hat", date: "2026-09-25", dateRange: "09/25–09/26", currency: "JPY" },
            { id: 8, region: "日本", city: "千葉", venue: "LaLa arena TOKYO-BAY", date: "2026-10-10", dateRange: "10/10–10/11", currency: "JPY" },
            { id: 9, region: "北美", city: "達拉斯", venue: "The Bomb Factory", date: "2026-10-30", dateRange: "10/30", currency: "USD" },
            { id: 10, region: "北美", city: "佛羅里達", venue: "Pompano Beach Amphitheater", date: "2026-11-01", dateRange: "11/01", currency: "USD" },
            { id: 11, region: "北美", city: "芝加哥", venue: "The Salt Shed", date: "2026-11-04", dateRange: "11/04", currency: "USD" },
            { id: 12, region: "北美", city: "紐約", venue: "Madison Square Garden", date: "2026-11-07", dateRange: "11/07", currency: "USD" },
            { id: 13, region: "北美", city: "多倫多", venue: "Queen Elizabeth Theatre", date: "2026-11-10", dateRange: "11/10", currency: "CAD" },
            { id: 14, region: "北美", city: "溫哥華", venue: "Queen Elizabeth Theatre", date: "2026-11-13", dateRange: "11/13", currency: "CAD" },
            { id: 15, region: "北美", city: "西雅圖", venue: "Showbox SoDo", date: "2026-11-15", dateRange: "11/15", currency: "USD" },
            { id: 16, region: "北美", city: "舊金山", venue: "The Warfield", date: "2026-11-17", dateRange: "11/17", currency: "USD" },
            { id: 17, region: "北美", city: "洛杉磯", venue: "Peacock Theater", date: "2026-11-20", dateRange: "11/20", currency: "USD" },
            { id: 18, region: "北美", city: "墨西哥城", venue: "Arena Ciudad de México", date: "2026-11-24", dateRange: "11/24", currency: "MXN" },
            { id: 19, region: "亞洲", city: "雅加達", venue: "ICE BSD Hall 5-6", date: "2026-12-05", dateRange: "12/05", currency: "IDR" },
            { id: 20, region: "亞洲", city: "吉隆坡", venue: "Unifi Arena", date: "2026-12-26", dateRange: "12/26", currency: "MYR" },
            { id: 21, region: "亞洲", city: "台北", venue: "NTSU Arena", date: "2027-01-09", dateRange: "01/09", currency: "TWD" },
            { id: 22, region: "亞洲", city: "香港", venue: "AsiaWorld-Arena", date: "2027-01-16", dateRange: "01/16", currency: "HKD" },
            { id: 23, region: "亞洲", city: "新加坡", venue: "Singapore Indoor Stadium", date: "2027-01-23", dateRange: "01/23", currency: "SGD" },
            { id: 24, region: "亞洲", city: "曼谷", venue: "Impact Arena", date: "2027-01-30", dateRange: "01/30", currency: "THB" }
        ];

        const regions = ["韓國", "日本", "北美", "亞洲"];

        function App() {
            const [selectedId, setSelectedId] = useState(null);
            const [expandedRegion, setExpandedRegion] = useState(null);
            const [expandedCategory, setExpandedCategory] = useState(null);
            const [plans, setPlans] = useState({});
            const [showModal, setShowModal] = useState(false);
            const [showBackup, setShowBackup] = useState(false);
            const [backupData, setBackupData] = useState("");
            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({ type: '', content: '', costTwd: '', costForeign: '', transportMode: '飛機', flightOut: '', flightBack: '', isDone: false });

            useEffect(() => {
                const saved = localStorage.getItem('bnd-planner-v12');
                if (saved) setPlans(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('bnd-planner-v12', JSON.stringify(plans));
            }, [plans]);

            const currentTour = tourData.find(t => t.id === selectedId);

            const getDDay = (targetDate) => {
                const today = new Date();
                today.setHours(0,0,0,0);
                const target = new Date(targetDate);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays === 0) return "TODAY";
                return diffDays > 0 ? `D-${diffDays}` : `D+${Math.abs(diffDays)}`;
            };

            const updateCost = (val, isTwd) => {
                const rate = RATES[currentTour.currency] || 1;
                if (isTwd) setForm({ ...form, costTwd: val, costForeign: val ? (val / rate).toFixed(0) : '' });
                else setForm({ ...form, costForeign: val, costTwd: val ? (val * rate).toFixed(0) : '' });
            };

            const savePlan = () => {
                const tourPlans = plans[selectedId] || [];
                const newItem = { ...form, id: editingId || Date.now(), costTwd: parseFloat(form.costTwd || 0) };
                setPlans({ ...plans, [selectedId]: editingId ? tourPlans.map(p => p.id === editingId ? newItem : p) : [...tourPlans, newItem] });
                setShowModal(false);
            };

            const toggleDone = (e, id) => {
                e.stopPropagation();
                const tourPlans = plans[selectedId].map(p => p.id === id ? { ...p, isDone: !p.isDone } : p);
                setPlans({ ...plans, [selectedId]: tourPlans });
            };

            const handleExport = () => {
                const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(plans))));
                setBackupData(dataStr);
                alert("備份代碼已生成！");
            };

            const handleImport = () => {
                try {
                    const decoded = JSON.parse(decodeURIComponent(escape(atob(backupData))));
                    if (confirm("匯入將覆蓋目前資料，確定嗎？")) {
                        setPlans(decoded);
                        alert("匯入成功！");
                        setShowBackup(false);
                    }
                } catch (e) { alert("代碼無效！"); }
            };

            const totalTwd = (plans[selectedId] || []).reduce((s, i) => s + (i.costTwd || 0), 0);

            const getCategoryStats = (type) => {
                const items = (plans[selectedId] || []).filter(p => p.type === type);
                if (type === '待辦') {
                    const doneCount = items.filter(i => i.isDone).length;
                    return items.length > 0 ? `${doneCount}/${items.length}` : "";
                }
                const sum = items.reduce((s, i) => s + (i.costTwd || 0), 0);
                return sum > 0 ? `TWD ${sum.toLocaleString()}` : "";
            };

            const getMapUrl = (venue, city, region) => {
                if (region === "韓國") return `https://map.naver.com/v5/search/${encodeURIComponent(venue + ' ' + city)}`;
                return `https://www.google.com/maps/search/${encodeURIComponent(venue + ' ' + city)}`;
            };

            return (
                <div className="max-w-xl mx-auto min-h-screen pb-20 px-5">
                    <header className="py-12 text-center">
                        <h1 className="text-4xl font-[900] text-blue-600 tracking-tighter italic leading-tight drop-shadow-sm">
                            BOYNEXTDOOR TOUR<br/>'KNOCK ON' Vol.2
                        </h1>
                        <p className="text-blue-400 font-bold text-xs tracking-[0.4em] uppercase mt-4">巡演制霸計畫</p>
                    </header>

                    {!selectedId ? (
                        <div className="space-y-4">
                            {regions.map(region => (
                                <div key={region} className="bg-white rounded-[2rem] card-shadow border border-white/50 overflow-hidden transition-all active:scale-[0.99]">
                                    <button onClick={() => setExpandedRegion(expandedRegion === region ? null : region)} className="w-full flex justify-between items-center p-7 hover:bg-blue-50/50 transition font-black text-slate-800 text-lg">
                                        {region}
                                        <i className={`fas fa-chevron-${expandedRegion === region ? 'up' : 'down'} text-blue-400`}></i>
                                    </button>
                                    {expandedRegion === region && (
                                        <div className="px-5 pb-7 space-y-3 animate-in slide-in-from-top duration-300 region-content">
                                            {tourData.filter(t => t.region === region).map(t => (
                                                <button key={t.id} onClick={() => setSelectedId(t.id)} className="w-full flex justify-between items-center p-6 bg-blue-50/50 rounded-3xl hover:bg-blue-100 hover:border-blue-200 border border-transparent transition text-left">
                                                    <div>
                                                        <div className="font-bold text-slate-800 text-lg mb-0.5">{t.city}</div>
                                                        <div className="text-[10px] text-blue-300 font-black uppercase tracking-widest leading-none">{t.venue}</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-[11px] font-black text-blue-600 italic">{t.dateRange}</div>
                                                        <div className="text-[9px] font-black text-blue-300 uppercase mt-1">{getDDay(t.date)}</div>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                            
                            <div className="mt-12 pt-8 border-t border-blue-100">
                                <button onClick={() => setShowBackup(!showBackup)} className="w-full py-4 text-blue-300 font-black text-[10px] tracking-[0.3em] uppercase flex items-center justify-center gap-2">
                                    <i className="fas fa-database"></i> 系統備份與移轉
                                </button>
                                {showBackup && (
                                    <div className="mt-4 bg-white p-6 rounded-[2rem] card-shadow border border-white animate-in fade-in zoom-in duration-300">
                                        <textarea className="w-full h-32 p-4 bg-slate-50 rounded-xl text-[10px] font-mono border-none mb-4" value={backupData} onChange={(e) => setBackupData(e.target.value)} placeholder="在此貼入備份代碼..." />
                                        <div className="flex gap-2">
                                            <button onClick={handleExport} className="flex-1 py-3 bg-slate-800 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">產生備份</button>
                                            <button onClick={handleImport} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">匯入還原</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="animate-in fade-in duration-500">
                            <button onClick={() => setSelectedId(null)} className="mb-6 text-blue-400 font-black text-[10px] tracking-widest uppercase flex items-center">
                                <i className="fas fa-arrow-left mr-2"></i> 返回區域選擇
                            </button>
                            
                            <div className="bg-white rounded-[2.5rem] p-8 card-shadow border border-white">
                                <div className="flex justify-between items-start mb-6">
                                    <div className="flex-1">
                                        <div className="flex items-center gap-3">
                                            <h2 className="text-4xl font-[900] text-slate-800 italic tracking-tighter">{currentTour.city}</h2>
                                            <span className="bg-blue-600 text-white text-[11px] font-[900] px-3 py-1 rounded-full italic shadow-lg shadow-blue-200">{getDDay(currentTour.date)}</span>
                                        </div>
                                        <a href={getMapUrl(currentTour.venue, currentTour.city, currentTour.region)} target="_blank" className="text-blue-500 font-bold text-xs mt-4 inline-flex items-center bg-blue-50 px-4 py-1.5 rounded-full transition hover:bg-blue-100">
                                            <i className="fas fa-map-location-dot mr-2 text-sm"></i> 
                                            {currentTour.region === "韓國" ? "Naver Map" : currentTour.venue}
                                        </a>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-[9px] font-black text-blue-200 uppercase tracking-tighter leading-none mb-1">Rate</div>
                                        <div className="font-black text-blue-300 italic text-sm">1:{RATES[currentTour.currency]}</div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 rounded-[2.25rem] p-7 text-white shadow-2xl shadow-blue-900/10 mb-8">
                                    <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">預估總花費</div>
                                    <div className="text-3xl font-[900] italic tracking-tighter text-blue-400">TWD {totalTwd.toLocaleString()}</div>
                                </div>

                                <div className="space-y-3">
                                    {[
                                        {type: '住宿', icon: 'fa-bed'},
                                        {type: '交通', icon: 'fa-plane'},
                                        {type: '待辦', icon: 'fa-check-double'},
                                        {type: '其他花費', icon: 'fa-comment-dollar'}
                                    ].map(cat => (
                                        <div key={cat.type} className="bg-blue-50/30 rounded-2xl overflow-hidden border border-blue-50/50">
                                            <div onClick={() => setExpandedCategory(expandedCategory === cat.type ? null : cat.type)} className="w-full flex justify-between items-center p-5 cursor-pointer hover:bg-white transition group">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-lg bg-white flex items-center justify-center shadow-sm text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition"><i className={`fas ${cat.icon} text-sm`}></i></div>
                                                    <span className="font-black text-slate-700 text-sm tracking-widest">{cat.type}</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-[10px] font-black text-blue-500 italic">{getCategoryStats(cat.type)}</span>
                                                    <i className={`fas fa-chevron-${expandedCategory === cat.type ? 'up' : 'down'} text-blue-200 text-xs`}></i>
                                                </div>
                                            </div>
                                            {expandedCategory === cat.type && (
                                                <div className="px-4 pb-4 space-y-2 animate-in slide-in-from-top duration-200">
                                                    <button onClick={() => { setEditingId(null); setForm({ type: cat.type, content: '', costTwd: '', costForeign: '', transportMode: cat.type === '交通' ? '飛機' : '其它', flightOut: '', flightBack: '', isDone: false }); setShowModal(true); }} className="w-full py-3 border-2 border-dashed border-blue-100 rounded-xl text-blue-200 text-[10px] font-black uppercase tracking-widest hover:border-blue-300 hover:text-blue-400 transition">+ 新增{cat.type}</button>
                                                    {(plans[selectedId] || []).filter(p => p.type === cat.type).map(item => (
                                                        <div key={item.id} onClick={() => { setEditingId(item.id); setForm(item); setShowModal(true); }} className="bg-white p-4 rounded-xl flex justify-between items-center border border-white shadow-sm cursor-pointer hover:border-blue-200 transition">
                                                            <div className="flex items-start gap-3 flex-1">
                                                                {item.type === '待辦' && <div onClick={(e) => toggleDone(e, item.id)} className={`mt-0.5 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all ${item.isDone ? 'bg-blue-600 border-blue-600' : 'border-blue-100'}`}>{item.isDone && <i className="fas fa-check text-[8px] text-white"></i>}</div>}
                                                                <div className="flex-1">
                                                                    <div className={`font-bold text-sm ${item.isDone ? 'checkmark-done text-slate-300' : 'text-slate-700'}`}>{item.type === '交通' && item.transportMode === '飛機' ? `${item.flightOut} ✈ ${item.flightBack}` : item.content}</div>
                                                                    {item.costTwd > 0 && <div className={`text-[10px] font-black italic mt-0.5 ${item.isDone ? 'text-slate-300' : 'text-blue-500'}`}>TWD {item.costTwd.toLocaleString()}</div>}
                                                                </div>
                                                            </div>
                                                            <i className="fas fa-edit text-blue-100 text-[9px]"></i>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 免責聲明與製作資訊 */}
                    <footer className="mt-16 text-center space-y-6">
                        <div className="space-y-2">
                            <p className="text-[10px] font-bold text-blue-300 uppercase tracking-widest">Disclaimer</p>
                            <p className="text-[10px] text-blue-300/70 max-w-xs mx-auto leading-relaxed px-4">
                                本工具僅供行程與預算紀錄參考，實際匯率與場館資訊請以官方公告為準。資料儲存於個人瀏覽器，建議定期備份以免遺失。
                            </p>
                        </div>
                        <a href="https://www.threads.net/@bnd_8wandoor.tw" target="_blank" className="inline-flex flex-col items-center group">
                            <span className="text-[11px] font-black text-slate-500 mb-2 transition group-hover:text-blue-600">Made by bnd_8wandoor.tw</span>
                            <div className="bg-slate-900 text-white p-2.5 rounded-full shadow-lg group-hover:scale-110 transition active:scale-95">
                                <i className="fab fa-threads text-lg"></i>
                            </div>
                        </a>
                    </footer>

                    {showModal && (
                        <div className="fixed inset-0 bg-blue-900/40 modal-blur z-[100] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 card-shadow border border-white animate-in zoom-in duration-200">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-[900] italic tracking-tighter text-slate-800 uppercase">{form.type}</h3>
                                    {editingId && <button onClick={() => { setPlans({...plans, [selectedId]: plans[selectedId].filter(p => p.id !== editingId)}); setShowModal(false); }} className="text-red-400 font-black text-[10px] uppercase tracking-widest">刪除</button>}
                                </div>
                                <div className="space-y-5">
                                    {form.type === '交通' && (
                                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                            {['飛機', '火車/高鐵', '巴士', '其它'].map(m => (
                                                <button key={m} onClick={() => setForm({...form, transportMode: m})} className={`px-4 py-2 rounded-xl text-[10px] font-black transition ${form.transportMode === m ? 'bg-blue-600 text-white shadow-md' : 'bg-blue-50 text-blue-400'}`}>{m}</button>
                                            ))}
                                        </div>
                                    )}
                                    {form.type === '待辦' && !editingId && (
                                        <div className="grid grid-cols-4 gap-2">
                                            {PRESET_TODOS.map(p => (
                                                <button key={p} onClick={() => setForm({...form, content: p})} className="py-2 rounded-lg bg-blue-50 text-blue-400 font-bold text-[10px] hover:bg-blue-600 hover:text-white transition">{p}</button>
                                            ))}
                                        </div>
                                    )}
                                    {form.type === '交通' && form.transportMode === '飛機' ? (
                                        <div className="grid grid-cols-2 gap-3">
                                            <input className="w-full p-4 bg-blue-50/50 rounded-2xl font-bold outline-none border border-transparent focus:border-blue-400 transition" placeholder="去程航班" value={form.flightOut} onChange={e => setForm({...form, flightOut: e.target.value.toUpperCase()})} />
                                            <input className="w-full p-4 bg-blue-50/50 rounded-2xl font-bold outline-none border border-transparent focus:border-blue-400 transition" placeholder="回程航班" value={form.flightBack} onChange={e => setForm({...form, flightBack: e.target.value.toUpperCase()})} />
                                        </div>
                                    ) : (
                                        <input className="w-full p-4 bg-blue-50/50 rounded-2xl font-bold outline-none border border-transparent focus:border-blue-400 transition" placeholder="內容名稱..." value={form.content} onChange={e => setForm({...form, content: e.target.value})} />
                                    )}
                                    {form.type !== '待辦' && (
                                        <div className="bg-blue-50/50 p-6 rounded-[2rem] space-y-4">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-black text-blue-600 w-12 uppercase">TWD</span>
                                                <input type="number" className="flex-1 bg-transparent border-b-2 border-blue-200 outline-none font-black text-blue-600 text-right" value={form.costTwd} onChange={e => updateCost(e.target.value, true)} />
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-black text-blue-300 w-12 uppercase">{currentTour.currency}</span>
                                                <input type="number" className="flex-1 bg-transparent border-b-2 border-blue-100 outline-none font-black text-blue-300 text-right" value={form.costForeign} onChange={e => updateCost(e.target.value, false)} />
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="flex gap-4 mt-10">
                                    <button onClick={() => setShowModal(false)} className="flex-1 py-4 font-black text-blue-200 uppercase tracking-widest text-[11px]">取消</button>
                                    <button onClick={savePlan} className="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-[900] shadow-xl shadow-blue-200 uppercase tracking-widest text-[11px]">儲存</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
